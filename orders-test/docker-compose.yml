name: orders-test

services:
  dynamodb-local:
    image: amazon/dynamodb-local
    container_name: dynamodb-local
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    ports:
      - "8000:8000"
    networks:
      - lambda-test

  # One-shot container that creates the orders-local table
  dynamodb-init:
    image: amazon/aws-cli
    depends_on:
      - dynamodb-local
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: eu-central-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until aws dynamodb list-tables --endpoint-url http://dynamodb-local:8000 >/dev/null 2>&1; do
          echo "waiting for dynamodb-local..."; sleep 1
        done
        aws dynamodb create-table \
          --table-name orders-local \
          --attribute-definitions AttributeName=orderId,AttributeType=S \
          --key-schema AttributeName=orderId,KeyType=HASH \
          --billing-mode PAY_PER_REQUEST \
          --endpoint-url http://dynamodb-local:8000 \
          || echo "table orders-local already exists"
    networks:
      - lambda-test

networks:
  lambda-test:
    name: lambda-test
